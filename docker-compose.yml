# Local development only. Production uses Supabase PostgreSQL.
name: devmsr-hms

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: hms
      POSTGRES_PASSWORD: hms_local_only
      POSTGRES_DB: hms
    ports:
      # Loopback only, so the database is never reachable from the network.
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U hms -d hms']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
