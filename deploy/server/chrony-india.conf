# Copy to /etc/chrony/sources.d/india.sources and comment out the default pools in
# /etc/chrony/chrony.conf, then `systemctl restart chrony` and check with `chronyc sources -v`.
# CERT-In's April 2022 directions ask for clocks synced to NIC or NPL time servers. Confirm the list
# with the auditor before go-live (docs/runbooks/server-hardening.md).
server samay1.nic.in iburst
server samay2.nic.in iburst
server time.nplindia.org iburst
