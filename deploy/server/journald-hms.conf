# Copy to /etc/systemd/journald.conf.d/hms.conf, then `sudo systemctl restart systemd-journald`.
# Keeps every log on the server for at least 180 days (CERT-In, April 2022 directions), compressed,
# in UTC. Container logs arrive through Docker's journald driver (deploy/server/docker-daemon.json).
# Check the size with `journalctl --disk-usage`; deploy/check-host.sh alerts before the disk fills.
[Journal]
Storage=persistent
Compress=yes
Seal=yes
# Delete entries only after 190 days, a margin over 180.
MaxRetentionSec=190day
MaxFileSec=1week
# Size cap: raise it if `journalctl --disk-usage` approaches it before 190 days, never lower it.
SystemMaxUse=20G
SystemKeepFree=5G
RateLimitIntervalSec=30s
RateLimitBurst=20000
