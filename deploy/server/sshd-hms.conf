# Copy to /etc/ssh/sshd_config.d/10-hms.conf, check with `sshd -t`, then `systemctl reload ssh`.
# Keep a second SSH session open until a new login works (docs/runbooks/server-hardening.md).
PasswordAuthentication no
KbdInteractiveAuthentication no
PubkeyAuthentication yes
AuthenticationMethods publickey
PermitRootLogin no
PermitEmptyPasswords no
# Only the deploy user may log in. Change the name if the server uses another.
AllowUsers hmsadmin
MaxAuthTries 3
LoginGraceTime 30
X11Forwarding no
AllowAgentForwarding no
AllowTcpForwarding no
ClientAliveInterval 300
ClientAliveCountMax 2
LogLevel VERBOSE
