name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Text, lint, typecheck, test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: hms
          POSTGRES_PASSWORD: hms_ci_only
          POSTGRES_DB: hms_test
          # Like many Indian servers. The app must store UTC whatever the server's time zone.
          TZ: Asia/Kolkata
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hms -d hms_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # The API tests wipe and migrate this throwaway database.
      TEST_DATABASE_URL: postgresql://hms:hms_ci_only@localhost:5432/hms_test
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:text
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      # Contract: pnpm test already fails if docs/openapi.json is stale against the routes. This
      # fails if the web app's generated client types are stale against docs/openapi.json.
      - name: Web API types match docs/openapi.json
        run: |
          pnpm --filter @devmsr/web api:types
          git diff --exit-code -- apps/web/src/lib/api/generated || { echo "Run pnpm api:spec and commit the result."; exit 1; }

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: pnpm audit --audit-level high

  e2e:
    name: End to end (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: hms
          POSTGRES_PASSWORD: hms_ci_only
          POSTGRES_DB: hms
          TZ: Asia/Kolkata
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hms -d hms"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # The API runs as its own restricted login, as in production. Migrations run as the owner.
      DATABASE_URL: postgresql://hms_app:hms_app_ci_only_pw@localhost:5432/hms
      DIRECT_URL: postgresql://hms:hms_ci_only@localhost:5432/hms
      # Background jobs run as a login that owns only the pgboss schema, also made by db:api-user.
      JOBS_DATABASE_URL: postgresql://hms_jobs:hms_jobs_ci_only_pw@localhost:5432/hms
      # Fake demo users from the seed, on a throwaway database.
      SEED_USER_PASSWORD: ci-only-Passw0rd
      # Base32 two-factor secret the seed gives admin, accounts and superadmin; e2e/totp.ts makes their codes.
      SEED_TOTP_SECRET: CIONLYDEMOTOTPKEYCIONLYDEMOTOTPK
      # The whole suite signs the same demo users in well within a minute. The login limit itself
      # is proven by the API tests (auth.api.spec.ts), so here it only needs to stay out of the way.
      RATE_LIMIT_LOGIN_PER_MINUTE: "1000"
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Generate secrets for this run
        run: |
          for name in SESSION_SECRET FIELD_ENCRYPTION_KEY; do
            value=$(openssl rand -base64 32)
            echo "::add-mask::$value"
            echo "$name=$value" >> "$GITHUB_ENV"
          done
      - run: pnpm db:deploy
      - run: pnpm db:api-user
      - run: pnpm db:seed
      - run: pnpm build
      - name: Put static files next to the standalone web server, as the Docker image does
        run: |
          cp -r apps/web/.next/static apps/web/.next/standalone/apps/web/.next/static
          cp -r apps/web/public apps/web/.next/standalone/apps/web/public
      - run: pnpm --filter @devmsr/web exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - name: Keep the Playwright report when a test fails
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7

  docker:
    name: Docker images
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build api image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/api/Dockerfile
          push: false
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max
      - name: Build web image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/web/Dockerfile
          push: false
          build-args: |
            NEXT_PUBLIC_API_URL=https://api.example.invalid/api/v1
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max
